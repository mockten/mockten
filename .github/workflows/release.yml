name: RELEASE

on:
  workflow_dispatch: {}

jobs:
  release-ecfront:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ecfront
    steps:
    - name: Checkout the repository
      uses: actions/checkout@v2
      
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push the docker image
      run: |
        VERSION="1.${{ github.run_number }}"
        BASE="ghcr.io/${{ github.repository_owner }}/ecfront"
        # No keys at build time: the image is environment-agnostic and reads its
        # config from the environment at container start (docker-entrypoint.sh).
        docker build -t "$BASE:latest" -t "$BASE:$VERSION" .
        docker push "$BASE:latest"
        docker push "$BASE:$VERSION"

