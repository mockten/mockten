    - name: Push the docker image
      run: |
        VERSION="1.${{ github.run_number }}"
        BASE="ghcr.io/${{ github.repository_owner }}/dashboard"
        # Root context so apigw/kong.yaml can be copied into the image. The running
        # version is baked in (ARG APP_VERSION) so the dashboard can display it.
        docker build -f Dockerfile --build-arg APP_VERSION="$VERSION" \
